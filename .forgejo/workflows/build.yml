name: Build Updater Firmware

on:
  push:
    branches: [main, master, release, develop]
    tags: ['v*']
  pull_request:
    branches: [main, master, release]
  workflow_dispatch:

jobs:
  build:
    runs-on: codeberg-medium

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build firmware
        run: pio run

      - name: Get version info
        id: version
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          if [[ "$GIT_REF" == refs/tags/* ]]; then
            VERSION="${GIT_REF#refs/tags/}"
          else
            VERSION="$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Rename firmware artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p artifacts
          cp .pio/build/cdc_badge_updater/firmware.bin    "artifacts/cdc-badge-updater-firmware-${VERSION}.bin"
          cp .pio/build/cdc_badge_updater/bootloader.bin  "artifacts/cdc-badge-updater-bootloader-${VERSION}.bin"
          cp .pio/build/cdc_badge_updater/partitions.bin  "artifacts/cdc-badge-updater-partitions-${VERSION}.bin"

      - name: Upload firmware artifacts
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: cdc-badge-updater-firmware-${{ steps.version.outputs.version }}
          path: artifacts/
          retention-days: 90

      - name: Create Codeberg release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TOKEN: ${{ forge.token }}
          TAG: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          set -euo pipefail
          RID=$(curl -sS -H "Authorization: token $TOKEN" \
            "$SERVER/api/v1/repos/$REPO/releases/tags/$TAG" | jq -r '.id // empty')
          if [ -z "$RID" ]; then
            RID=$(curl -fsS -X POST \
              -H "Authorization: token $TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"draft\":false,\"prerelease\":false}" \
              "$SERVER/api/v1/repos/$REPO/releases" | jq -r '.id')
          fi
          for f in artifacts/*; do
            curl -fsS -X POST \
              -H "Authorization: token $TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" \
              "$SERVER/api/v1/repos/$REPO/releases/$RID/assets?name=$(basename "$f")"
          done
