name: Build Updater Firmware

on:
  push:
    branches: [main, master, release, develop]
    tags: ['v*']
  pull_request:
    branches: [main, master, release]
  workflow_dispatch:

jobs:
  build:
    runs-on: docker
    container:
      image: catthehacker/ubuntu:act-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build firmware
        run: pio run

      - name: Get version info
        id: version
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          if [[ "$GIT_REF" == refs/tags/* ]]; then
            VERSION="${GIT_REF#refs/tags/}"
          else
            VERSION="$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Rename firmware artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p artifacts
          cp .pio/build/cdc_badge_updater/firmware.bin    "artifacts/cdc-badge-updater-firmware-${VERSION}.bin"
          cp .pio/build/cdc_badge_updater/bootloader.bin  "artifacts/cdc-badge-updater-bootloader-${VERSION}.bin"
          cp .pio/build/cdc_badge_updater/partitions.bin  "artifacts/cdc-badge-updater-partitions-${VERSION}.bin"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cdc-badge-updater-firmware-${{ steps.version.outputs.version }}
          path: artifacts/
          retention-days: 90
