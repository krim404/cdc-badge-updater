name: Deploy Codeberg Pages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: codeberg-medium

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build firmware
        run: pio run

      - name: Resolve version tag
        id: version
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          VERSION="${GIT_REF#refs/tags/}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Assemble pages content
        env:
          TAG: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p _site
          cp web-flasher/index.html _site/
          if [ -f web-flasher/badge.jpg ]; then cp web-flasher/badge.jpg _site/; fi

          cp .pio/build/cdc_badge_updater/bootloader.bin _site/bootloader.bin
          cp .pio/build/cdc_badge_updater/partitions.bin _site/partitions.bin
          cp .pio/build/cdc_badge_updater/firmware.bin   _site/firmware.bin

          cat > _site/manifest.json <<MANIFEST
          {
            "name": "CDC Badge Updater",
            "version": "${TAG}",
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  { "path": "bootloader.bin", "offset": 0 },
                  { "path": "partitions.bin", "offset": 32768 },
                  { "path": "firmware.bin", "offset": 327680 }
                ]
              }
            ]
          }
          MANIFEST

      - name: Deploy to Codeberg Pages
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: 'https://${{ forge.repository_owner }}.codeberg.page/cdc-badge-updater/'
          token: ${{ forge.token }}
          source: _site/
