; PlatformIO Project Configuration File
; CDC Badge Updater

[platformio]
src_dir = main

[env:cdc_badge_updater]
platform = espressif32@6.12.0
board = cdc-badge-updater
framework = espidf
board_build.partitions = partitions.csv
board_build.flash_size = 16MB
board_build.psram = enabled
board_build.sdkconfig_defaults = sdkconfig.defaults
platform_packages =
    framework-espidf @ ~3.50500.0
    toolchain-xtensa-esp32s3 @ 12.2.0+20230208
build_flags =
    -std=gnu++17
    -D BUILD_TIME=__TIME__
    -D BUILD_DATE=__DATE__
    -D APP_NAME=\"CDCBupd\"
    -D APP_VERSION=\"0.1.1\"
    -DLT_HELPERS
    ; UPDATER_DRY_RUN: 0 = LIVE flash (default), 1 = inspection only.
    ; Live mode wipes NVS, erases populated TROPIC01 ECC + R-Memory slots
    ; (R-Config / pairing keys remain untouched), then writes the embedded
    ; fw_CPU.h / fw_SPECT.h blobs after Y/N confirmation. Set to 1
    ; temporarily to exercise the surrounding flow on hardware without
    ; touching the secure element.
    -DUPDATER_DRY_RUN=0
lib_deps =

build_unflags =
    -std=gnu++2b
    -std=gnu++23

extra_scripts =
    pre:tools/pio_python_deps.py
    pre:tools/pio_submodules.py

monitor_speed = 115200
